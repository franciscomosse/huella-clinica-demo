<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Huella Clínica · Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: barra de roles arriba; debajo, una pantalla por rol o las cuatro en grilla 2x2, todas leyendo la misma receta en vivo. */
:root {
  --bg: #ECEFF4; --surface: #FFFFFF; --surface-2: #F5F7FA; --sunken: #E4E9F0;
  --ink: #101A2B; --ink-2: #2B3648; --muted: #586477; --line: #D5DBE4;
  --navy: #14213D; --brand: #C2551F; --on-accent: #FFFFFF;
  --medico: #2A6F97; --paciente: #6247B8; --farmacia: #23845A; --obra: #C2551F;
  --ok: #1C774F; --ok-bg: #E2F2E9; --warn: #8F5C06; --warn-fill: #F2A93B; --warn-bg: #FBF0DA;
  --bad: #B53A25; --bad-bg: #FAE5DF; --info: #2A6F97; --info-bg: #E1EDF5;
  --shadow: 0 1px 2px rgba(16, 26, 43, .06), 0 10px 28px rgba(16, 26, 43, .07);
  --scrim: rgba(12, 19, 34, .72);
  --head-pct: 100%; --head-ink: #FFFFFF; --head-icon: #FFFFFF;
  --f-display: 'Oswald', 'Arial Narrow', Arial, sans-serif;
  --f-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Consolas, 'Courier New', monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --sim-bg: #F6F1E7; --sim-ink: #14213D; --sim-line: #8C7B5E; --sim-on: #FFFFFF;
  --line-strong: #7D889B;
  --fs-cap: 12px; --fs-sm: 13px; --fs-body: 15px; --fs-h3: 16px; --fs-kpi: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1220; --surface: #131C2E; --surface-2: #19243A; --sunken: #0F1828;
    --ink: #E9EEF6; --ink-2: #C9D2E0; --muted: #96A3B9; --line: #27334A;
    --navy: #0E1628; --brand: #F08A55; --on-accent: #0B1220;
    --medico: #6CB4E0; --paciente: #A996F2; --farmacia: #4FC48C; --obra: #F08A55;
    --ok: #4FC48C; --ok-bg: rgba(79, 196, 140, .14); --warn: #F2B64A; --warn-fill: #F2B64A; --warn-bg: rgba(242, 182, 74, .14);
    --bad: #F27A62; --bad-bg: rgba(242, 122, 98, .15); --info: #6CB4E0; --info-bg: rgba(108, 180, 224, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    --scrim: rgba(5, 9, 18, .8); --head-pct: 28%; --head-ink: #E9EEF6; --head-icon: initial;
    --sim-bg: #221E17; --sim-ink: #F1E6D2; --sim-line: #8F806A; --sim-on: #1A1610; --line-strong: #64718B;
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) .p-head { box-shadow: inset 0 3px 0 var(--accent); }
  :root:not([data-theme="light"]) .p-head .ic { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }
}
:root[data-theme="dark"] {
  --bg: #0B1220; --surface: #131C2E; --surface-2: #19243A; --sunken: #0F1828;
  --ink: #E9EEF6; --ink-2: #C9D2E0; --muted: #96A3B9; --line: #27334A;
  --navy: #0E1628; --brand: #F08A55; --on-accent: #0B1220;
  --medico: #6CB4E0; --paciente: #A996F2; --farmacia: #4FC48C; --obra: #F08A55;
  --ok: #4FC48C; --ok-bg: rgba(79, 196, 140, .14); --warn: #F2B64A; --warn-fill: #F2B64A; --warn-bg: rgba(242, 182, 74, .14);
  --bad: #F27A62; --bad-bg: rgba(242, 122, 98, .15); --info: #6CB4E0; --info-bg: rgba(108, 180, 224, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
  --scrim: rgba(5, 9, 18, .8); --head-pct: 28%; --head-ink: #E9EEF6; --head-icon: initial;
  --sim-bg: #221E17; --sim-ink: #F1E6D2; --sim-line: #8F806A; --sim-on: #1A1610; --line-strong: #64718B;
  color-scheme: dark;
}
:root[data-theme="dark"] .p-head { box-shadow: inset 0 3px 0 var(--accent); }
:root[data-theme="dark"] .p-head .ic { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent); }

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
html { scroll-padding-top: calc(var(--top-h, 64px) + 12px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent, var(--brand)); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: -999px; top: 8px; z-index: 50; }
.skip:focus { left: 16px; background: #F2F4F8; color: #14213D; padding: 10px 14px; border-radius: 10px; border: 0; font-weight: 700; }
#view:focus { outline: none; }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #F2F4F8; }
.topbar-in { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; margin-right: 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: #C2551F; display: grid; place-items: center; }
.brand-name { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.brand-tag { display: block; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9FB0C8; margin-top: 3px; }
/* las pestañas no se achican: si no entran al lado de la marca, bajan enteras a su propia fila */
.nav { display: flex; gap: 6px; flex: 1 0 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; color: #C9D3E3; text-decoration: none; font-weight: 600; font-size: 14px; border: 1px solid transparent; }
.nav a:hover { background: rgba(255, 255, 255, .07); color: #FFFFFF; }
.nav a[aria-current="page"] { background: #F2F4F8; color: #14213D; }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #C9D3E3; padding: 6px 10px; border-radius: 999px; background: rgba(255, 255, 255, .06); }
.status i { width: 8px; height: 8px; border-radius: 50%; background: #F2B64A; flex: none; }
.status[data-mode="live"] i { background: #4FC48C; box-shadow: 0 0 0 0 rgba(79, 196, 140, .6); animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(79, 196, 140, .55); } 80%, 100% { box-shadow: 0 0 0 7px rgba(79, 196, 140, 0); } }

/* ---------- contenedor ---------- */
.wrap { padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }
.sample { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* ---------- inicio ---------- */
.home { display: grid; gap: 26px; }
.home-head { display: grid; gap: 10px; max-width: 780px; }
.home-head h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4.4vw, 46px); line-height: 1.04; letter-spacing: .01em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.home-head p { margin: 0; font-size: 17px; color: var(--ink-2); max-width: 64ch; }
.home-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.roles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.role-card { --accent: var(--medico); display: grid; gap: 10px; align-content: start; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.role-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--accent); }
.role-card:hover { border-color: var(--accent); }
.role-card .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.role-card h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
.role-card p { margin: 0; color: var(--muted); font-size: 14px; }
.role-card .go { font-weight: 700; font-size: 14px; color: var(--accent); }
.role-card .try { font-size: 14px; color: var(--ink-2); }
.role-card .try b { color: var(--ink); }
.home h2.sec { font: 600 20px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); margin: 6px 0 -12px; }
.howto { display: grid; gap: 12px; }
.home .howto h2.sec { margin: 0; }
.howto ol { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; font-size: 16px; color: var(--ink-2); max-width: 70ch; }
.howto li::marker { font-family: var(--f-display); font-weight: 600; color: var(--brand); }
.howto .sim-tag { vertical-align: 1px; }
.if-live { display: none; }
:root[data-sync="live"] .if-live { display: inline; }
:root[data-sync="live"] .if-local { display: none; }
.ctrls-d > summary { cursor: pointer; font-weight: 700; color: var(--ink-2); padding: 8px 0; width: max-content; max-width: 100%; }
.ctrls-d[open] > summary { margin-bottom: 12px; }

/* ---------- botones y formularios ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 14px; text-decoration: none; transition: transform .08s ease, filter .15s ease; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent, var(--brand)); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn-ghost:hover { border-color: var(--accent, var(--brand)); }
.btn-ok { background: var(--ok); color: var(--on-accent); }
.btn-warn { background: var(--warn-fill); color: #241703; }
.btn-bad { background: var(--bad); color: var(--on-accent); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn[aria-disabled="true"] { opacity: .45; cursor: progress; }
.btn-sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.input, .select { width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.input::placeholder { color: var(--muted); opacity: 1; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.input:focus, .select:focus { border-color: var(--accent, var(--brand)); }
.input:focus-visible, .select:focus-visible { outline: 3px solid var(--accent, var(--brand)); outline-offset: 1px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--sunken); gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent, var(--brand)); color: var(--on-accent); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
.seg button[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- chips de estado ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.t-ok { color: var(--ok); background: var(--ok-bg); }
.t-warn { color: var(--warn); background: var(--warn-bg); }
.t-bad { color: var(--bad); background: var(--bad-bg); }
.t-info { color: var(--info); background: var(--info-bg); }

/* ---------- paneles ---------- */
.wrap.full { max-width: none; padding-block: 14px 18px; }
.board { display: flex; flex-direction: column; gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 14px; }
@media (min-width: 1280px) {
  .board { height: calc(100vh - var(--top-h, 64px) - 32px); height: calc(100dvh - var(--top-h, 64px) - 32px); min-height: 460px; }
  .board .p-body { overscroll-behavior: contain; }
  .board .grid4 { flex: 1; min-height: 0; }
}
.solo { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
.solo.is-phone { max-width: 440px; }
.panel { --accent: var(--medico); container-type: inline-size; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; position: relative; min-width: 0; min-height: 0; transition: box-shadow .25s ease; }
.panel.is-next { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }

/* guía de la demo */
.coach { --accent: var(--medico); display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r-md); background: var(--sim-bg); border: 1px dashed var(--sim-line); box-shadow: inset 4px 0 0 var(--accent); min-width: 0; color: var(--sim-ink); }
.coach-n { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-family: var(--f-display); font-weight: 600; font-size: 15px; }
.coach-t { min-width: 0; font-size: 15px; color: var(--sim-ink); }
.coach-t b { color: color-mix(in srgb, var(--accent) 75%, var(--sim-ink)); font-weight: 700; }
.coach-go { margin-left: auto; flex: none; }
.coach { flex-wrap: wrap; row-gap: 8px; }
.coach-t { flex: 1 1 240px; }

/* datos fijos de la receta (médico) */
.facts { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 10px; }
.facts div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; gap: 1px; min-width: 0; }
.facts small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts b { font-size: 15px; font-weight: 600; }
.facts span { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel[data-role="medico"] { --accent: var(--medico); }
.panel[data-role="paciente"] { --accent: var(--paciente); }
.panel[data-role="farmacia"] { --accent: var(--farmacia); }
.panel[data-role="obra"] { --accent: var(--obra); }
.p-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: color-mix(in srgb, var(--accent) var(--head-pct), var(--surface)); color: var(--head-ink); border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); flex: none; }
.p-head .ic { color: var(--head-icon, var(--accent)); }
.p-head .ic { width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; flex: none; }
.p-title { display: grid; min-width: 0; }
.p-title b { font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
.p-title small { font-size: 13px; opacity: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-head .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.p-body { padding: 16px; display: grid; gap: 16px; align-content: start; overflow-y: auto; flex: 1; min-height: 0; background: var(--surface-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
.card-h h3 { margin: 0; font: 600 16px/1.2 var(--f-display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.empty { display: grid; gap: 6px; justify-items: start; padding: 14px; border-radius: var(--r-md); border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.empty b { color: var(--ink-2); font-weight: 600; }

/* lista de recetas */
.rows { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 8px; border-top: 1px solid var(--line); }
.who small .mono { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.row:first-child { border-top: 0; }
.row .who { min-width: 0; display: grid; }
.row .who b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who small { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who b, .row .who small { white-space: normal; }
.code { font-family: var(--f-mono); font-size: 13px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.row .meta { display: grid; justify-items: end; gap: 3px; }
.row .meta small { color: var(--muted); font-size: 12px; }
button.row { width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
button.row:first-child { border-top: 0; }
button.row:hover { background: var(--surface-2); }
button.row[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 26%, transparent); } 100% { background: transparent; } }

/* estado de la receta en curso (médico) */
.live { display: grid; gap: 12px; padding: 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); }
.live-top { display: flex; gap: 12px; align-items: center; }
.pulse { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--info-bg); color: var(--info); position: relative; }
.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--info); opacity: .5; animation: ring 1.6s ease-out infinite; }
@keyframes ring { from { transform: scale(.85); opacity: .6; } to { transform: scale(1.3); opacity: 0; } }
.badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.badge.ok { background: var(--ok); color: var(--on-accent); }
.badge.warn { background: var(--warn-fill); color: #241703; }
.badge.bad { background: var(--bad); color: var(--on-accent); }
.live h4 { margin: 0; font-size: 16px; font-weight: 700; }
.live p { margin: 0; color: var(--muted); font-size: 14px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.inline-form .field { flex: 1 1 200px; }

/* ---------- paciente (celular) ---------- */
.phone-body { background: var(--surface-2); }

.cred { border-radius: 16px; padding: 16px; color: #FFFFFF; background: linear-gradient(135deg, #3E2A8C, #6247B8 55%, #7E63D6); display: grid; gap: 14px; position: relative; overflow: hidden; }
.cred::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: rgba(255, 255, 255, .08); }
.cred .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; opacity: .9; }
.cred .name { font-family: var(--f-display); font-weight: 600; font-size: 24px; letter-spacing: .03em; text-transform: uppercase; line-height: 1; }
.cred .num { font-family: var(--f-mono); font-size: 15px; letter-spacing: .12em; }
.cred .foot { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.cred.is-compact { grid-auto-flow: column; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 10px; }
.cred.is-compact .top, .cred.is-compact .foot { display: none; }
.cred.is-compact .name { font-size: 18px; }
.cred.is-compact .num { font-size: 13px; }
.request { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.request h4 { margin: 0; font-size: 16px; }
.request p { margin: 0; color: var(--ink-2); font-size: 14px; }
.rx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.rx .info { display: grid; gap: 4px; min-width: 0; }
.rx .info b { font-size: 15px; }
.rx .info small { color: var(--muted); font-size: 13px; }
.qr { width: 66px; height: 66px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); padding: 5px; display: grid; grid-template-columns: repeat(11, 1fr); gap: 1px; }
.qr i { background: var(--ink); border-radius: 1px; }
.qr i.o { background: transparent; }
.feed { display: grid; gap: 10px; }
.feed-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; font-size: 14px; }
.feed-item .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--muted); }
.feed-item time { color: var(--muted); font-size: 12px; }
.feed-item p { margin: 0; color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.r-medico, .r-recepcion { background: var(--medico) !important; }
.t-mute { color: var(--muted); background: var(--sunken); }
.turno-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.turnos .row { grid-template-columns: minmax(0, 1fr) auto; }
.turnos .row .who b, .turnos .row .who small { white-space: normal; }
.llegada-ok { border-left: 5px solid var(--ok); }
.llegada-ok .req-top .badge { width: 34px; height: 34px; }
.r-paciente { background: var(--paciente) !important; }
.r-farmacia { background: var(--farmacia) !important; }
.r-obra, .r-sistema { background: var(--obra) !important; }

/* ---------- farmacia ---------- */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 38px; }
.price { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); }
.price div { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 8px 0; display: grid; gap: 2px; grid-auto-flow: column; justify-content: space-between; align-items: baseline; }
.price small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.price b { font-size: 16px; font-variant-numeric: tabular-nums; }
.price div:last-child b { font: 600 24px/1 var(--f-display); color: var(--farmacia); }
.checks { display: grid; gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check .mk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.mk.ok { background: var(--ok); color: var(--on-accent); }
.mk.warn { background: var(--warn-fill); color: #241703; }
.mk.bad { background: var(--bad); color: var(--on-accent); }
.check span { min-width: 0; }
.check span small { display: block; color: var(--muted); font-size: 13px; }
.verdict { border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 4px; }
.verdict b { font-size: 15px; }
.verdict span { font-size: 14px; color: var(--ink-2); }
.v-ok { background: var(--ok-bg); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.v-warn { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn-fill) 55%, transparent); }
.v-bad { background: var(--bad-bg); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); }

/* ---------- obra social ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi b { font-family: var(--f-display); font-weight: 600; font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi.k-ok b { color: var(--ok); } .kpi.k-warn b { color: var(--warn); } .kpi.k-bad b { color: var(--bad); }
.bar { height: 10px; border-radius: 999px; overflow: hidden; display: flex; background: var(--sunken); }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td .sub { display: block; color: var(--muted); font-size: 12px; }
.audit { display: grid; gap: 8px; }
.audit-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.audit-item b { font-size: 14px; }
.audit-item small { display: block; color: var(--muted); font-size: 13px; }
.audit-item.hot { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: var(--bad-bg); }

/* ---------- escaneo de rostro ---------- */
.scan { position: absolute; inset: 0; z-index: 5; background: var(--scrim); display: grid; justify-items: center; align-items: start; padding: 18px; }
.scan-card { width: min(300px, 100%); background: var(--surface); border-radius: 22px; padding: 18px; display: grid; gap: 12px; justify-items: center; box-shadow: var(--shadow); border: 1px solid var(--line); }
.scan-frame { width: 168px; height: 168px; position: relative; display: grid; place-items: center; }
.scan-frame svg.face { width: 128px; height: 128px; }
.scan-frame .br { position: absolute; width: 30px; height: 30px; border: 5px solid var(--accent); }
.br.tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
.br.tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
.br.bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
.br.brr { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
.scan-line { position: absolute; left: 14px; right: 14px; height: 3px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 14px 3px color-mix(in srgb, var(--accent) 55%, transparent); animation: sweep 1.1s ease-in-out infinite alternate; }
@keyframes sweep { from { top: 18px; } to { top: calc(100% - 20px); } }
.scan-card p { margin: 0; font-weight: 700; }
.scan-card small { color: var(--muted); text-align: center; }
.scan[data-done="ok"] .br { border-color: var(--ok); }
.scan[data-done="warn"] .br { border-color: var(--warn); }
.scan[data-done="bad"] .br { border-color: var(--bad); }
.scan[data-done] .scan-line { display: none; }

/* ---------- avisos ---------- */
.toasts { position: fixed; z-index: 40; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(360px, calc(100vw - 32px)); }
.toast { background: var(--navy); color: #F2F4F8; border-radius: 12px; padding: 11px 14px; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: rise .25s ease-out; border-left: 4px solid var(--t, #4FC48C); }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- piezas de la versión 2 ---------- */
.card, .live { grid-template-columns: minmax(0, 1fr); }
.btn-block { white-space: normal; text-align: center; line-height: 1.2; padding-block: 9px; }
.stack { display: grid; gap: 16px; min-width: 0; align-content: start; }
.hint { margin: 0; font-size: 14px; color: var(--muted); }
.muted-s { color: var(--muted); font-size: 13px; }
.aside { font-size: 14px; font-weight: 500; color: var(--muted); }
.q { display: grid; gap: 6px; justify-items: start; }
.q-l { font-size: 15px; font-weight: 600; color: var(--ink); }
.p-purpose { margin: 0; font-size: 15px; color: var(--ink-2); }
.board .p-purpose { display: none; }
.head-tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.vchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .02em; background: rgba(0, 0, 0, .22); white-space: nowrap; }
.link { border: 0; background: none; padding: 2px 0; font-weight: 600; font-size: 13px; color: var(--accent, var(--brand)); text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }
.sub-h { margin-top: 10px; padding: 8px 8px 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--bad); border-top: 1px solid var(--line); }

/* médico */
.live-txt { min-width: 0; display: grid; gap: 2px; }
.live-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.live details summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.live details .inline-form { margin-top: 10px; }

/* paciente */
.req-top { display: flex; gap: 12px; align-items: center; }
.req-txt { display: grid; gap: 2px; min-width: 0; }
.req-txt h4 { margin: 0; font-size: 16px; }
.req-txt p { margin: 0; color: var(--ink-2); font-size: 14px; }
.pulse-acc { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.pulse-acc::after { border-color: var(--accent); }
.notice { border: 2px solid var(--warn-fill); background: var(--warn-bg); }
.row.rx { grid-template-columns: minmax(0, 1fr) auto; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.deleg { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.deleg div { display: grid; gap: 2px; }
.deleg small { color: var(--muted); font-size: 13px; }

/* farmacia */
.card-h h3 { display: inline-flex; align-items: center; gap: 7px; }
.card-h h3 svg { width: 16px; height: 16px; }
.rx-head { display: grid; gap: 2px; }
.rx-head b { font-size: 18px; }
.rx-head span { color: var(--muted); font-size: 14px; }
.person { display: flex; gap: 10px; align-items: center; }
.person svg { flex: none; }
.person div { display: grid; min-width: 0; }
.person small { color: var(--muted); }
.receipt { border-width: 1px 1px 1px 5px; border-style: solid; }
.receipt-ok { border-left-color: var(--ok); }
.receipt-warn { border-left-color: var(--warn-fill); }
.receipt-bad { border-left-color: var(--bad); }
.kv { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.kv div { min-width: 0; }
.kv dt { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 2px 0 0; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.kv dd small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }

/* obra social: señales */
.audit-item { grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.ai-txt { display: grid; gap: 2px; min-width: 0; }
.ai-tipo { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ai-act { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.audit-item { border-left: 4px solid var(--warn-fill); grid-template-columns: minmax(0, 1fr); gap: 4px; }
.audit-item.lvl-alta, .audit-item.lvl-media { background: var(--surface); }
.audit-item.lvl-alta { border-left-color: var(--bad); }
.audit-item.done { border-left-color: var(--line); }
.ai-list { list-style: none; margin: 0; padding: 0; display: grid; }
.ai-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: start; padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); }
.ai-list li:first-child { margin-top: 2px; }
.ai-s { font-size: 14px; font-weight: 600; }
.ai-more { justify-self: start; }
.cell-btn { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; color: var(--ink); cursor: pointer; }
.cell-btn:hover { color: var(--accent); }
tr.is-sel td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.show-narrow { display: none; }
td .sub.show-narrow { display: none; }
.trace-sum { display: grid; gap: 3px; font-size: 14px; color: var(--ink-2); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 12px 44px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 0; position: relative; }
.timeline li::before { content: ""; position: absolute; left: 5px; top: 20px; bottom: -6px; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; position: relative; z-index: 1; }
.timeline time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.timeline p { margin: 0; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.trace-al { display: flex; flex-wrap: wrap; gap: 6px; }
.trace-al .chip { white-space: normal; }
.demo-txt { font-size: 14px; color: var(--muted); flex: 1 1 220px; }

/* inicio: qué controla */
.ctrls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ctrl { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: start; align-content: start; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); }
.ctrl-ic { grid-row: span 2; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
.ctrl b { font-size: 15px; }
.ctrl span:last-child { font-size: 14px; color: var(--muted); }

/* foco visible dentro de la barra de navegación (que recorta hacia arriba y abajo) */
.nav a:focus-visible { outline-offset: -3px; }
.toasts { pointer-events: none; }

/* ---------- capa «▷ Simulador»: controles de la demo, fuera del producto ---------- */
.sim { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px; color: var(--sim-ink); font-size: 14px; background: repeating-linear-gradient(-45deg, transparent 0 9px, color-mix(in srgb, var(--sim-line) 10%, transparent) 9px 10px), var(--sim-bg); border-bottom: 1px dashed var(--sim-line); }
.sim-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--sim-ink); color: var(--sim-on); white-space: nowrap; }
.sim-q { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.sim-q > .lbl { font-weight: 600; }
.sim-q > span[id] { display: contents; }
.sim .seg { background: transparent; border: 1px dashed var(--sim-line); padding: 2px; border-radius: 9px; }
.sim .seg button { color: var(--sim-ink); padding: 5px 10px; border-radius: 6px; }
.sim .seg button[aria-pressed="true"] { background: var(--sim-ink); color: var(--sim-on); box-shadow: none; }
.sim .btn { min-height: 32px; font-size: 13px; border: 1px dashed var(--sim-line); color: var(--sim-ink); background: transparent; }
.sim .btn-bad { background: var(--bad); border: 1px solid var(--bad); color: var(--on-accent); }
.sim .hint, .sim .demo-txt { color: var(--sim-ink); opacity: .8; }
.sim .confirm { flex: 1 1 260px; min-width: 0; }
/* configuración de la obra social (plegada en «Las 4 juntas») */
.cfg > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 6px 0; }
.cfg[open] > summary { margin-bottom: 10px; }
.cfg-body { display: grid; gap: 10px; }
/* «Las 4 juntas»: más compacto */
.grid4 .p-body { padding: 12px; gap: 12px; }
.grid4 .empty { border: 0; padding: 2px 0; }
.grid4 .kpi b { font-size: 26px; }

@container (max-width: 520px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .row .meta { display: flex; justify-content: space-between; align-items: center; }
  .row .who b, .row .who small { white-space: normal; }
  .row.rx { grid-template-columns: minmax(0, 1fr) auto; }
  .show-narrow { display: inline-flex; margin-top: 4px; }
  td .sub.show-narrow { display: block; margin-top: 2px; }
  .ai-list li { grid-template-columns: minmax(0, 1fr); }
  td .chip { white-space: normal; }
  .kv { grid-template-columns: minmax(0, 1fr); }
  .audit-item { grid-template-columns: minmax(0, 1fr); }
  .ai-act { justify-content: flex-start; }
  .turno-act { justify-content: flex-start; }
  .facts small { letter-spacing: .04em; }
}
@container (max-width: 360px) {
  .facts div:last-child span { display: none; }
  .price { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .price div { grid-auto-flow: column; justify-content: space-between; align-items: baseline; }
}
@media (max-width: 1100px) { .ctrls { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .ctrls { grid-template-columns: minmax(0, 1fr); }
  .brand-tag { display: none !important; }
  .status { order: 2; margin-left: auto; }
  .nav { order: 3; flex-basis: 100%; }
}

/* ---------- adaptable ---------- */
/* cada pantalla se acomoda a su propio ancho: angosta en "Las 4 juntas", ancha cuando está sola */
@container (max-width: 720px) {
  .two, .form-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@container (max-width: 520px) {
  .hide-narrow { display: none; }
  .p-head .right { display: none; }
  .audit-item { grid-template-columns: minmax(0, 1fr); }
  .audit-item .chip { justify-self: start; }
  .kpi b { font-size: 30px; }
}
@media (max-width: 1279px) {
  .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: max(540px, calc(100vh - var(--top-h, 64px) - 40px)); }
  .roles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 859px) {
  .grid4 { grid-template-columns: minmax(0, 1fr); grid-auto-rows: auto; }
  .grid4 .p-body { overflow: visible; }
}
@media (max-width: 760px) {
  .roles { grid-template-columns: minmax(0, 1fr); }
}
/* guía: fija arriba en «Las 4 juntas» mientras se baja de un panel a otro */
@media (max-width: 1279px) {
  .board > .coach { position: sticky; top: calc(var(--top-h, 64px) + 8px); z-index: 15; }
  /* guía pegada: «Ir ↓» al lado del texto, no en una fila aparte (tapa menos pantalla en el celular) */
  .board > .coach .coach-t { flex-basis: 0; }
  /* se suma al scroll-padding-top de html (barra + 12 px): el panel queda 8 px debajo de la guía */
  .board .panel { scroll-margin-top: calc(var(--coach-h, 90px) + 4px); }
}
@media (min-width: 1280px) { .board .coach-go { display: none; } }
@media (max-width: 1360px) { .status .long { display: none; } }
@media (max-height: 500px) {
  .topbar { position: relative; top: 0; }
  html { --top-h: 0px !important; }
  /* celular apaisado: marca, pestañas y estado en una sola fila */
  .topbar-in { padding-block: 6px; gap: 6px 10px; }
  .brand-tag { display: none; }
  #sync-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .status { padding: 8px; }
  .nav a { padding: 6px 10px; }
}

      if (r.retiro && r.retiro.quien !== 'afiliado' && r.retiro.nombre) persona(r.retiro.nombre, r, r.retiro.quien === 'otra');

        detalle: (p.sinAut ? 'Intentó retirar recetas de ' + n + ' afiliados distintos sin autorización (' + p.sinAut + (p.sinAut === 1 ? ' intento denegado' : ' intentos denegados') + '): no se le entregó nada.' : 'Retiró para ' + n + ' afiliados distintos.') + (dr ? ' Recetas ' + delDr(dr) + '.' : ''), nivel: p.sinAut ? 'alta' : 'media' });
    });

      // La firma rechazada es del consultorio, no del paciente: no suma a sus alertas.

      if (!al.length) return;

      p.n += al.length;
      al.forEach(function (x) { if (x.t >= p.t) { p.t = x.t; p.last = x.txt; p.r = r; } if (x.tipo === 'desconocida') p.propias++; });
    });
    Object.keys(porAf).forEach(function (k) {
      if (!has(AFILIADOS, k)) return;
      var p = porAf[k];
      // Sin alertas propias (no reconoció una receta, llegada con otra cara), el afiliado es afectado, no sospechoso.
      var propia = p.propias > 0 || !!(llegadas && has(llegadas, k) && llegadas[k].fallos);
      out.push({ key: 'af-' + k, tipo: 'Afiliado', titulo: af(k).nombre + ' · ' + p.n + (p.n === 1 ? ' alerta' : ' alertas'), detalle: 'Receta ' + delDr(medico(p.r.medicoId)) + ': ' + p.last, nivel: propia && p.n >= 2 ? 'media' : 'baja' });
    });
    if (llegadas) Object.keys(llegadas).forEach(function (k) {
      var l = llegadas[k];
      if (!has(AFILIADOS, k) || !l.fallos) return;
      out.push({ key: 'af-lleg-' + k, tipo: 'Afiliado', titulo: af(k).nombre + ' · llegada con otra cara', detalle: (l.fallos === 1 ? 'Un intento' : l.fallos + ' intentos') + ' de validar la llegada al consultorio con una cara que no es la suya.', nivel: 'media' });
    });
    var peso = { alta: 0, media: 1, baja: 2 };
    return out.sort(function (x, y) { return peso[x.nivel] - peso[y.nivel]; });
  }

  /* ================= avisos ================= */
  // En el celular, un aviso a la vez; cada uno dura lo que se tarda en leerlo.
  function toast(msg, tone) {
    var host = document.getElementById('toasts'); if (!host) return;
    var col = { ok: '#4FC48C', warn: '#F2B64A', bad: '#F27A62', info: '#6CB4E0' }[tone || 'ok'];
    var el = document.createElement('div');
    el.className = 'toast'; el.style.setProperty('--t', col); el.textContent = msg;
    host.appendChild(el);
    var max = 2; try { if (window.matchMedia('(max-width: 760px)').matches) max = 1; } catch (e) {}
    while (host.children.length > max) host.removeChild(host.firstChild);
    setTimeout(function () { el.remove(); }, Math.min(9000, Math.max(4000, 1200 + String(msg).length * 45)));
  }

  /* ================= escaneo de rostro ================= */
  var REDUCED = false;
  try { REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  function faceScan(panelEl, persona, outcome, labels, sub) {
    return new Promise(function (resolve) {
      var prev = document.activeElement, ov = document.createElement('div');
      ov.className = 'scan';
      ov.innerHTML = '<div class="scan-card"><div class="scan-frame">' + faceSVG(persona) +
        '<span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br brr"></span><div class="scan-line"></div></div>' +
        '<p class="msg" role="status">Escaneando rostro…</p><small>' + esc(sub || 'Validación facial contra RENAPER (simulada)') + '</small></div>';
      // La tarjeta va en la parte del panel que se está viendo (en el celular el panel puede ser más alto que la pantalla).
      var pr = panelEl.getBoundingClientRect(), vTop = Math.max(pr.top, 0), vBot = Math.min(pr.bottom, window.innerHeight);
      ov.style.paddingTop = Math.max(18, (vTop + vBot) / 2 - pr.top - 150) + 'px';
      // Mientras dura el escaneo, el resto del panel no se puede tocar ni recorrer con el teclado.
      var sibs = Array.prototype.slice.call(panelEl.children);
      sibs.forEach(function (c) { c.inert = true; });
      panelEl.appendChild(ov);
      var card = ov.querySelector('.scan-card'); card.tabIndex = -1;
      try { card.focus({ preventScroll: true }); } catch (e) {}
      setTimeout(function () {
        ov.setAttribute('data-done', outcome);
        var p = ov.querySelector('.msg'), s = ov.querySelector('small');
        p.textContent = labels[0]; s.textContent = labels[1];
        p.style.color = outcome === 'ok' ? 'var(--ok)' : outcome === 'warn' ? 'var(--warn)' : 'var(--bad)';
        setTimeout(function () {
          // Si durante el escaneo el usuario pasó con Tab a otra parte de la página, el foco se queda ahí.
          var ae = document.activeElement, fuera = ae && ae !== document.body && ae !== document.documentElement && !ov.contains(ae) && !panelEl.contains(ae);
          sibs.forEach(function (c) { c.inert = false; });
          ov.remove();
          if (!fuera && prev && prev !== document.body && document.contains(prev)) { try { prev.focus({ preventScroll: true }); } catch (e) {} }
          resolve();
        }, 1400);
      }, REDUCED ? 300 : 1500);
    });
  }

      else if (enModoLlegada() && (!lg || lg.t < ct) && (!r || r.actualizada < ct) && !ocupada) s = ['medico', 1, 'Ahora el paciente valida al llegar. En Recepción tocá «Pedir Face ID» al lado de Rosa (o validá desde la app de Rosa). Ana viene como particular: valida en la consulta.'];
      else if (enModoLlegada() && lg && (lg.estado === 'esperando' || !r || lg.t > r.actualizada)) {
        if (lg.estado === 'esperando') s = ['paciente', 2, 'En la app de ' + corto + ', tocá «Validar llegada con Face ID».'];
        else if (lg.estado === 'validada' && tokenValido(lk)) s = ['medico', 3, corto + ' ya validó su llegada. En «Nueva receta» elegí a ' + corto + ' y firmá: sale sin otro Face ID.'];
        else if (lg.estado === 'validada') s = ['medico', 1, 'La llegada de ' + corto + ' venció: en Recepción, pedí de nuevo su Face ID.'];
        else if (lg.estado === 'fuera') s = ['medico', 2, corto + ' validó fuera del consultorio. Si es una teleconsulta, en «Nueva receta» elegí «Estoy haciendo telemedicina» y tocá «Reintentar» en Recepción.'];
        else s = ['medico', 2, 'La cara no coincidió al llegar y la obra social ya tiene la señal. Tocá «Reintentar» en Recepción, o firmá igual: el Face ID se pide en la consulta.'];
      }
      if (s) { /* ya está */ }
      else if (!r) s = ['medico', 1, conFace ? 'Elegí paciente y medicamento y tocá «Firmar con Face ID». Para ver el bloqueo, antes elegí «Secretaria» en el Simulador.' : 'Elegí paciente y medicamento y tocá «Firmar con usuario y clave». Con «Secretaria» en el Simulador, la firma pasa igual.'];
      else if (r.estado === 'firma_rechazada') s = ['medico', 1, 'Firma bloqueada: no era el titular de la matrícula y la obra social ya tiene la alerta. Volvé a «Dr. Ruiz» en el Simulador y firmá.'];
      else if (r.estado === 'esperando' && r.consulta && r.consulta.resultado === 'lugar' && !Store.tele()) s = ['medico', 2, X + ' validó desde su casa y la receta no salió. Si es una teleconsulta, en «Nueva receta» elegí «Estoy haciendo telemedicina» y que ' + X + ' valide de nuevo.'];
      else if (r.estado === 'esperando') s = ['paciente', 2, 'En la app de ' + X + ', tocá «Validar con Face ID». En el Simulador, «Otra persona» no coincide y «En su casa» sin telemedicina queda fuera del consultorio.'];
      else if (r.estado === 'no_coincide') s = ['medico', 2, 'La cara no coincidió. El médico decide: emitir con excepción (deja una alerta y le avisa al paciente) o no emitir.'];
      else if (r.estado === 'emitida_alerta' && porConfirmar(r)) s = ['paciente', 3, 'Salió con excepción: a ' + X + ' le llegó un aviso. «No la reconozco» la anula; «Sí, es mía» la deja lista para la farmacia.'];
      else if (dispensable(r) && r.intentos && r.intentos.length) s = ['farmacia', 3, 'Retiro denegado: no era ' + X + ' ni un familiar autorizado, no se entregó y quedó la alerta. Ahora elegí «' + X + ' (titular)» o el familiar autorizado y validá.'];
      else if (dispensable(r)) s = ['farmacia', 3, 'Elegí la receta de ' + X + ': se valida el QR. Después, en el Simulador, elegí quién vino a retirar y validá su Face ID. Con «Otra persona», el retiro se deniega.'];
      else if (r.estado === 'anulada') s = ['obra', 4, X + ' no reconoció la receta: quedó anulada y aparece en «Señales para revisar».'];
      else if (r.estado === 'rechazada') s = ['medico', 1, 'La receta no se emitió y quedó registrada. Probá con otra.'];
      else if (r.reconocida === false) s = ['obra', 4, X + ' no reconoció una receta que ya se había retirado: suma una alerta y aparece en «Señales para revisar».'];
      else if (!todas.some(function (x) { return x.simulada; })) s = ['obra', 4, (r.estado === 'sin_cobertura' ? 'Se dispensó sin cobertura y quedó la alerta.' : r.estado === 'dispensada_alerta' ? 'Dispensada por un familiar: suma una alerta.' : 'Dispensada con cobertura.') + ' Tocá la receta en «Recetas» para ver su recorrido. Después, en el Simulador, «Cargar actividad de ejemplo».'];
      else s = ['obra', 4, 'Mirá «Señales para revisar»: la IA marca a la Dra. Méndez (7 recetas en una hora, 4 sin Face ID del paciente). Son señales: el auditor decide si abre una auditoría.'];
      // En una pantalla sola, si el paso es de otra, la guía lleva hasta ella; en «Las 4 juntas», baja hasta el panel.
      var go = !multi && keys[0] === s[0] ? '' : multi ? '<button type="button" class="btn btn-sm btn-ghost coach-go" data-go="' + s[0] + '">Ir ↓</button>'
        : '<a class="btn btn-sm btn-ghost coach-go" href="#' + RUTA[s[0]] + '">Ir a ' + NOMBRE[s[0]] + ' →</a>';
      var key = s.join('|') + go;
      if (key === last) return;
      last = key;
      el.style.setProperty('--accent', 'var(--' + s[0] + ')');
      el.innerHTML = '<span class="coach-n">' + s[1] + '</span><span class="coach-t"><b>Paso ' + s[1] + ' · ' + NOMBRE[s[0]] + '</b> ' + esc(s[2]) + '</span>' + go;
      if (multi) keys.forEach(function (k) { panels[k].classList.toggle('is-next', k === s[0]); });
    }
    return { render: render };
  }

  (function () {
    var tb = document.querySelector('.topbar');
    function setTop() { document.documentElement.style.setProperty('--top-h', tb.offsetHeight + 'px'); }
    setTop();
    try { new ResizeObserver(setTop).observe(tb); } catch (e) { window.addEventListener('resize', setTop); }
  })();
  window.addEventListener('hashchange', route);
  // «Ir a la pantalla»: es un botón (un enlace a #view dispararía el router).
  (function () { var sk = document.getElementById('skip'); if (sk) sk.addEventListener('click', function () { var v = document.getElementById('view'); if (v) v.focus(); }); })();
  route();
  Store.init();
})();
</script>
